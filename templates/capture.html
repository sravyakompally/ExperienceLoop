{% extends "base.html" %}{% block content %}<section class="pagehead"><span class="eyebrow">MODULE 01</span><h1>Capture experience</h1><p>Record what happened, what was tried, and what the organization learned.</p></section><form id="captureForm" class="panel formgrid"><label>Experience type *<select name="experience_type" required><option value="">Select type</option>{% for x in ['Customer Complaint','Project Failure','Operational Incident','Employee Experience','Previous Decision','Success Story','Other'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Title *<input name="title" required placeholder="Repeated customer delivery delays"></label><label class="wide">Situation *<textarea name="situation" required placeholder="What happened?"></textarea></label><label class="wide">Context<textarea name="context" placeholder="Conditions or circumstances involved"></textarea></label><label>Action taken<textarea name="action_taken" placeholder="What did the organization try?"></textarea></label><label>Reason for action<textarea name="reason_for_action"></textarea></label><label>Outcome *<textarea name="outcome" required></textarea></label><label>Success / failure *<select name="success_or_failure" required><option value="">Select</option>{% for x in ['Successful','Partially Successful','Failed','Unknown'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Root cause<textarea name="root_cause"></textarea></label><label>Lesson learned *<textarea name="lesson_learned" required></textarea></label><label>Challenges<textarea name="challenges"></textarea></label><label>Department<select name="department">{% for x in ['Operations','Customer Support','Engineering','Sales','HR','Finance','Logistics','Other'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Author<input name="author" placeholder="Name or role"></label><label class="wide">Verification status<select name="verification_status">{% for x in ['Human-Verified Experience','Unverified Observation','Officially Approved','AI-Generated Hypothesis','Outdated - Requires Review'] %}<option>{{x}}</option>{% endfor %}</select></label><div class="wide actions"><button class="button" type="submit">Save experience</button><span id="result" role="status"></span></div></form><script src="{{ url_for('static', filename='js/capture.js') }}"></script>{% endblock %}
